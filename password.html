<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumina - Change password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100" style="background-image: url('./img/fondo2.jpg'); background-size: cover;"> <!-- Ruta ajustada -->
    
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-4 bg-white p-4 shadow rounded">
                <div class="text-center">
                    <img class="img-fluid mb-3" src="img/chain.png" alt="" style="width: 150px;">
                    <h1 class="h3">¿Tienes problemas para entrar?</h1>
                    <p class="text-muted">Introduce tu correo electrónico y te enviaremos un enlace para que vuelvas a entrar en tu cuenta.</p>
                </div>
                
                <form>
                    <div class="mb-3">
                        <input type="email" id="email" class="form-control" placeholder="Ingrese su correo electrónico" required>
                    </div>  

                    <div class="d-grid">
                        <a href="login.html" class="btn btn-primary fw-bold">Enviar enlace de acceso</a>
                    </div>
                </form>
                
                <div class="d-flex align-items-center my-3">
                    <hr class="flex-grow-1">
                    <span class="mx-2">o</span>
                    <hr class="flex-grow-1">
                </div>
                
                <div class="text-center">
                    <a href="signup.html" class="text-decoration-none">Crear cuenta nueva</a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
