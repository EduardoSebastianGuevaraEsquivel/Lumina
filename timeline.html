<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumina</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="Css/timeline.css">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

    <br>
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand fs-2" href="timeline.html" style="color: purple; font-weight: bold;">LUMINA</a>
            <div class="d-flex justify-content-center w-100">
                <input class="search form-control w-30" type="search" name="search" placeholder="Buscar">
            </div>
            <div class="icons d-flex">
                <a href="#" class="me-3"><img class="explore" src="img/explore.png" alt="explore"></a>
                <a href="#" class="me-3"><img class="like" src="img/like.png" alt="like"></a>
                <a href="profile.html"><img class="profile" src="img/profile.png" alt="profile"></a>
            </div>
        </div>
    </nav>

    <div class="recommendations position-fixed top-0 end-0 z-index-1 bg-white shadow-sm rounded-3 p-3" style="width: 20%; height: 100vh; margin-top: 100px;">
        <h3 class="fs-5 mb-3">Personas que podrías conocer:</h3>
        <div class="recomendation-content">
            <div class="user-wrapper d-flex justify-content-between mb-3">
                <div class="users d-flex align-items-center gap-2">
                    <img class="icon" src="profile/icon5.png" alt="">
                    <p>A$AP Rocky</p>
                </div>
                <button class="follow-btn btn btn-primary btn-sm">Seguir</button>
            </div>
            <div class="user-wrapper d-flex justify-content-between mb-3">
                <div class="users d-flex align-items-center gap-2">
                    <img class="icon" src="profile/icon3.png" alt="">
                    <p>Dasky</p>
                </div>
                <button class="follow-btn btn btn-primary btn-sm">Seguir</button>
            </div>
            <div class="user-wrapper d-flex justify-content-between mb-3">
                <div class="users d-flex align-items-center gap-2">
                    <img class="icon" src="profile/icon4.png" alt="">
                    <p>Kendrick Lamar</p>
                </div>
                <button class="follow-btn btn btn-primary btn-sm">Seguir</button>
            </div>
        </div>
    </div>

    <div class="cards-container d-flex flex-column align-items-center gap-4 mt-5 pt-5">
        <!-- Post I -->
        <div class="card shadow-sm">
            <div class="user d-flex align-items-center gap-2 p-3">
                <a href="profile.html"><img class="icon" src="img/photo.png" alt=""></a>
                <p class="ms-2" style="margin-top: 12px; margin-right: 170px;">Sebastian Guevara</p>
            </div>
            <img src="img/post.png" alt="Avatar" class="card-img-top">
            <div class="container p-3">
                <div class="icons-post d-flex gap-3">
                    <a href="#"><img class="icon-p" src="img/like.png" alt="like"></a>
                    <a href="#"><img class="icon-p" src="img/comment.png" alt="comment"></a>
                    <a href="#"><img class="icon-p" src="img/bookmark.png" alt="bookmark"></a>
                </div>
                <div class="total-likes d-flex align-items-center gap-2 mt-2">
                    <img class="like-total" src="img/heart.png" alt="">
                    <p style="margin-top: 16px;">230 likes</p>
                </div>
                <div class="commentaries mt-2">
                    <p class="comment">@Chaviloca: Genial!</p>
                </div>
            </div>
        </div>  

        <!-- Post II -->
        <div class="card shadow-sm">
            <div class="user d-flex align-items-center gap-2 p-3">
                <img class="icon" src="profile/icon.png" alt="">
                <p class="ms-2" style="margin-top: 12px; margin-right: 170px;">Erick Mata</p>
            </div>
            <img src="img/post3.png" alt="Avatar" class="card-img-top">
            <div class="container p-3">
                <div class="icons-post d-flex gap-3">
                    <a href="#"><img class="icon-p" src="img/like.png" alt="like"></a>
                    <a href="#"><img class="icon-p" src="img/comment.png" alt="comment"></a>
                    <a href="#"><img class="icon-p" src="img/bookmark.png" alt="bookmark"></a>
                </div>
                <div class="total-likes d-flex align-items-center gap-2 mt-2">
                    <img class="like-total" src="img/heart.png" alt="">
                    <p style="margin-top: 16px;">12 likes</p>
                </div>
                <div class="commentaries mt-2">
                    <p class="comment">@Sebastian:LOL</p>
                </div>
            </div>
        </div>  

        <!-- Post III -->        
        <div class="card shadow-sm">
            <div class="user d-flex align-items-center gap-2 p-3">
                <img class="icon" src="profile/icon2.png" alt="">
                <p class="ms-2" style="margin-top: 12px; margin-right: 170px;">Chaviloca</p>
            </div>
            <img src="img/post4.png" alt="Avatar" class="card-img-top">
            <div class="container p-3">
                <div class="icons-post d-flex gap-3">
                    <a href="#"><img class="icon-p" src="img/like.png" alt="like"></a>
                    <a href="#"><img class="icon-p" src="img/comment.png" alt="comment"></a>
                    <a href="#"><img class="icon-p" src="img/bookmark.png" alt="bookmark"></a>
                </div>
                <div class="total-likes d-flex align-items-center gap-2 mt-2">
                    <img class="like-total" src="img/heart.png" alt="">
                    <p style="margin-top: 16px;">30 likes</p>
                </div>
                <div class="commentaries mt-2">
                    <p class="comment">@Erick: nice game</p>
                </div>
            </div>
        </div> 
    </div>
    <br>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
