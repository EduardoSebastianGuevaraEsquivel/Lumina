<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Roboto:wght@100;400;700&display=swap" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f5f5f5;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container-fluid {
            height: 100vh;
        }

        .left-section {
            background-image: url('./img/fondo.jpg'); /* Ruta ajustada */
            background-size: cover;
            background-position: center;
            height: 100%;
        }

        .form-container {
            background-color: #fff;
            padding: 40px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
        }

        .logo {
            font-size: 2.5rem;
            color: purple;
            text-align: center;
            font-weight: bold;
        }

        .register2, .password {
            color: #007bff;
            text-decoration: none;
        }

        .register2:hover, .password:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row h-100">
            <div class="col-md-6 left-section d-none d-md-block"></div>
            <div class="col-md-6 d-flex align-items-center justify-content-center">
                <div class="form-container w-75">
                    <h1 class="logo">LUMINA</h1>
                    <p class="text-center">Regístrate para ver fotos y videos de tus amigos.</p>
                    <form id="signupForm">
                        <div class="mb-3">
                            <label for="nombre" class="form-label">Nombre completo</label>
                            <input type="text" id="nombre" class="form-control" placeholder="Ingrese su nombre completo">
                        </div>

                        <div class="mb-3">
                            <label for="gener" class="form-label">Seleccione su Género</label>
                            <select class="form-select" id="gener" onchange="toggleOtherInput()">
                                <option value="masculino">Masculino</option>
                                <option value="femenino">Femenino</option>
                                <option value="aplica">No aplica</option>
                                <option value="no">Prefiero no decirlo</option>
                                <option value="otro">Otro</option>
                            </select>
                            <input type="text" id="other-input" class="form-control mt-2" placeholder="Especifique su género" style="display: none;">
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">Email Address</label>
                            <input type="email" id="email" class="form-control" placeholder="Ingrese su correo electrónico">
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" id="password" class="form-control" placeholder="Ingrese su contraseña">
                        </div>

                        <div class="text-center">
                            <p>¿Tienes una cuenta? <a href="login.html" class="register2">Inicia sesión</a></p>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">Registrarme</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        function toggleOtherInput() {
            const select = document.getElementById('gener');
            const otherInput = document.getElementById('other-input');
            otherInput.style.display = (select.value === 'otro') ? 'block' : 'none';
        }

        $(document).ready(function () {
            $("#signupForm").submit(function (e) {
                e.preventDefault();

                let email = $("#email").val();
                let password = $("#password").val();

                localStorage.setItem("userEmail", email);
                localStorage.setItem("userPassword", password);

                alert("Registro exitoso. Ahora inicia sesión.");
                window.location.href = "login.html";
            });
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
