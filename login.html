<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumina - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Roboto:wght@100;400;700&display=swap" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f5f5f5;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container-fluid {
            height: 100vh;
        }

        .left-section {
            background-image: url('./img/fondo.jpg'); /* Asegúrate que esta ruta sea correcta */
            background-size: cover;
            background-position: center;
            height: 100%;
        }

        .form-container {
            background-color: #fff;
            padding: 40px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
        }

        .logo {
            font-size: 2.5rem;
            color: purple;
            text-align: center;
        }

        .register2, .password {
            color: #007bff;
            text-decoration: none;
        }

        .register2:hover, .password:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row h-100">
            <div class="col-md-6 left-section d-none d-md-block"></div>
            <div class="col-md-6 d-flex align-items-center justify-content-center">
                <div class="form-container w-75">
                    <h1 class="logo">Login</h1>
                    <p class="text-center">Inicia sesión para ver fotos y videos de tus amigos.</p>
                    <form id="loginForm">
                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" id="loginEmail" class="form-control" placeholder="Ingrese su correo electrónico">
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" id="loginPassword" class="form-control" placeholder="Ingrese su contraseña">
                        </div>

                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" id="remember">
                            <label class="form-check-label" for="remember">Recordar Sesión</label>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Iniciar Sesión</button>
                        <p class="text-center mt-3">¿No tienes una cuenta? <a href="signup.html" class="register2">Regístrate</a></p>
                        <p class="text-center"><a href="password.html" class="password">¿Has olvidado la contraseña?</a></p>      
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        $(document).ready(function () {
            $("#loginForm").submit(function (e) {
                e.preventDefault();

                let email = $("#loginEmail").val();
                let password = $("#loginPassword").val();

                if (email === localStorage.getItem("userEmail") && password === localStorage.getItem("userPassword")) {
                    alert("Inicio de sesión exitoso.");
                    window.location.href = "timeline.html";
                } else {
                    alert("Correo o contraseña incorrectos.");
                }
            });
        });
    </script>
</body>
</html>
